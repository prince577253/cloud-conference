apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-conference
  namespace: cloud-conference
  labels:
    app: cloud-conference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-conference
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cloud-conference
    spec:
      containers:
      - name: cloud-conference
        # Note: Replace <DOCKERHUB_USERNAME> during actual deployment or via CI/CD
        image: <DOCKERHUB_USERNAME>/cloud-conference:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
