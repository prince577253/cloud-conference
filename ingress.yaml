apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-conference-ingress
  namespace: cloud-conference
  annotations:
    # If using Docker Desktop's built-in ingress or Nginx ingress controller
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: cloud-conference.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloud-conference-service
            port:
              number: 80
